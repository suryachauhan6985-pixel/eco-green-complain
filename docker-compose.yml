version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecogreen_cms_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - APP_URL=http://localhost:5173
      - WHATSAPP_PROVIDER=SIMULATED
      - EMAIL_PROVIDER=SIMULATED
    volumes:
      - cms_data:/app/data
      - cms_uploads:/app/uploads
    restart: unless-stopped

volumes:
  cms_data:
  cms_uploads:
